services:
  db:
    build: ./db
    container_name: app_db_dev
    restart: unless-stopped
    env_file:
      - ./db/.env.dev
    expose:
      - "5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: app_adminer_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: app_backend_dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ${FILE_STORAGE_ROOT}:${FILE_STORAGE_ROOT}
    command: ["python", "run.py"]

  frontend:
    build: ./frontend
    container_name: app_frontend_dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]

  shiny:
    build: ./shiny
    container_name: app_shiny_dev
    restart: unless-stopped
    env_file:
      - ./shiny/.env.dev
    ports:
      - "3838:3838"
    volumes:
      - ${SHINY_SERVER_APP_DIR}:/srv/shiny-server
      - renv_cache_dev:/renv/cache

  nginx:
    image: nginx:1.27-alpine
    container_name: app_nginx_dev
    env_file:
      - ./nginx/.env.dev
    depends_on:
      - backend
      - shiny
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  postgres_data_dev:
    driver: local
  renv_cache_dev:
    driver: local