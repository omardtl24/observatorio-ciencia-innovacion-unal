services:
  db:
    build: ./db
    container_name: app_db_dev
    restart: unless-stopped
    env_file:
      - ./db/.env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: app_adminer_dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: app_backend_dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    command: ["python", "run.py"]

  frontend:
    build: ./frontend
    container_name: app_frontend_dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]

volumes:
  postgres_data_dev:
    driver: local