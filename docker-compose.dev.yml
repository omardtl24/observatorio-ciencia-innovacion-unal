services:
  db:
    build: ./db
    container_name: app_db_dev
    restart: unless-stopped
    env_file:
      - ./db/.env.dev
    expose:
      - "5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  adminer:
    image: adminer:latest
    container_name: app_adminer_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - app_net

  backend:
    build: ./backend
    container_name: app_backend_dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    volumes:
      - ./backend:/app
      - ${FILE_STORAGE_ROOT}:${FILE_STORAGE_ROOT}
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "run.py"]
    networks:
      - app_net

  frontend:
    build: ./frontend
    container_name: app_frontend_dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    networks:
      - app_net

  shinyserver:
    build: ./shiny
    container_name: app_shiny_dev
    restart: unless-stopped
    env_file:
      - ./shiny/.env.dev
    expose:
      - "3838"
    volumes:
      - ${SHINY_SERVER_APP_DIR}:/srv/shiny-server
      - renv_cache_dev:/renv/cache
      - r_libs_dev:/usr/local/lib/R/site-library
    networks:
      - app_net

  gateway:
    build: ./gateway
    container_name: app_gateway_dev
    restart: unless-stopped
    env_file:
      - ./gateway/.env.dev
    depends_on:
      - backend
      - shinyserver
    ports:
      - "80:8000"
    networks:
      - app_net

volumes:
  renv_cache_dev:
    driver: local
  r_libs_dev:
    driver: local
  postgres_data_dev:
    driver: local


networks:
  app_net:
    driver: bridge