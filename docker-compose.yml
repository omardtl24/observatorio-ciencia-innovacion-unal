services:
  db:
    build: ./db
    container_name: app_db
    restart: always
    env_file:
      - ./db/.env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: app_backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: app_frontend
    restart: always
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"

volumes:
  pgdata:
    driver: local