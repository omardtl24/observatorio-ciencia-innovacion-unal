services:
  db:
    build: ./db
    container_name: app_db
    restart: unless-stopped
    env_file:
      - ./db/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: app_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: app_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: app_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"

volumes:
  postgres_data:
    driver: local
