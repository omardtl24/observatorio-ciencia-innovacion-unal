# =========================
# WEBSOCKETS (Shiny)
# =========================
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# =========================
# SHINY TEMP COOKIE ROUTING
# If cookie exists -> skip auth
# =========================
map $cookie_shiny_gate $shiny_target {
    default @shiny_authed;
    ""      @shiny_needs_auth;
}

# =========================
# DOCKER LOG FORMAT
# =========================
log_format docker_pretty
'$remote_addr - [$time_local] '
'"$request" $status '
'route=$route '
'upstream=$upstream_addr '
'time=$request_time '
'rt=$upstream_response_time '
'uri=$request_uri '
'upgrade=$http_upgrade '
'ua="$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout docker_pretty;
    error_log /dev/stderr warn;

    # =========================
    # HEALTHCHECKS
    # =========================
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ping {
        access_log off;
        default_type text/plain;
        return 200 "running\n";
    }

    # =========================
    # FRONTEND (/)
    # =========================
    location / {
        access_log off;
        set $route "frontend";

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass ${NGINX_FRONTEND_URL};
    }

    # =========================
    # BACKEND (/api)
    # =========================
    location /api/ {
        access_log off;
        set $route "backend";

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/api/?(.*)$ /$1 break;

        proxy_pass ${NGINX_BACKEND_URL};
    }

    # =========================
    # SHINY (/shiny-server/*)
    # IMPORTANT: no rewrite here
    # =========================
    # =========================================================
    # SOCKJS FIX (CRITICAL)
    # =========================================================
    location ~ ^/shiny-server(/.+/__sockjs__/.*)$ {
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        # KEEP app path intact
        rewrite ^/shiny-server/(.+)$ /$1 break;

        proxy_pass ${NGINX_SHINY_URL};
    }

    location /shiny-server/ {
        set $route "shiny";

        if ($request_uri ~ ^/shiny-server(/.*)$) {
            set $shiny_path $1;
        }

        error_page 418 = $shiny_target;
        return 418;
    }

    location @shiny_needs_auth {
        auth_request /_validate_shiny_access;
        error_page 401 = @invalid_access;
        error_page 403 = @invalid_access;

        add_header Set-Cookie "shiny_gate=$request_id; Max-Age=3600; Path=/shiny-server/; HttpOnly; Secure; SameSite=None" always;

        rewrite ^ $shiny_path break;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        proxy_pass ${NGINX_SHINY_URL};
    }

    location @shiny_authed {
        rewrite ^ $shiny_path break;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        proxy_pass ${NGINX_SHINY_URL};
    }

    # =========================
    # INTERNAL AUTH CHECK
    # =========================
    location = /_validate_shiny_access {
        access_log off;
        internal;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Authorization "Bearer $cookie_user_jwt";

        proxy_pass ${NGINX_BACKEND_URL}/access$shiny_path;
    }

    # =========================
    # ACCESS DENIED
    # =========================
    location @invalid_access {
        default_type application/json;
        return 403 '{"Error":"El usuario no tiene acceso a esta aplicación de Shiny."}';
    }
}