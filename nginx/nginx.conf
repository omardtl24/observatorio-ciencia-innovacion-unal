
# =========================
# WEBSOCKETS (Shiny)
# =========================
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# =========================
# DOCKER LOG FORMAT (READABLE)
# =========================
log_format docker_pretty
'$remote_addr - [$time_local] '
'"$request" $status '
'route=$route '
'upstream=$upstream_addr '
'time=$request_time '
'rt=$upstream_response_time '
'uri=$request_uri '
'upgrade=$http_upgrade '
'ua="$http_user_agent"';

server {
    listen 80;
    server_name _;

    # =========================
    # LOGS TO DOCKER
    # =========================
    access_log /dev/stdout docker_pretty;
    error_log /dev/stderr warn;

    # =========================
    # HEALTHCHECKS
    # =========================
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ping {
        default_type text/plain;
        return 200 "running\n";
    }

    # =========================
    # FRONTEND (/)
    # =========================
    location / {
        set $route "frontend";

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass ${NGINX_FRONTEND_URL};
    }

    # =========================
    # BACKEND (/api)
    # =========================
    location /api/ {
        set $route "backend";

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # remove /api prefix
        rewrite ^/api/?(.*)$ /$1 break;

        proxy_pass ${NGINX_BACKEND_URL};
    }

    # =========================
    # SHINY (/shiny-server/{id})
    # =========================
    location /shiny-server/ {
        set $route "shiny";

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # IMPORTANT: strip prefix correctly
        rewrite ^/shiny-server/?(.*)$ /$1 break;

        proxy_pass ${NGINX_SHINY_URL};
    }
}