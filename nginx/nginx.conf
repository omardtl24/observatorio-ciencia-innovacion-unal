# Required for WebSocket upgrades used by Shiny sessions.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Accept resourceType from query param first, then fallback to header.
map $arg_resourceType $resource_type {
    default $arg_resourceType;
    '' $http_resourcetype;
}

server {
    listen 80;
    server_name _;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ping {
        default_type text/plain;
        return 200 "running\n";
    }

    location ~ ^/apps/(?<app_id>[0-9]+)(?<app_path>/.*)?$ {
        set $resolved_app_path $app_path;
        if ($resolved_app_path = "") {
            set $resolved_app_path /;
        }

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass ${NGINX_SHINY_URL}/$app_id$resolved_app_path$is_args$args;
    }

}