
# =========================
# WEBSOCKETS (Shiny)
# =========================
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# =========================
# DOCKER LOG FORMAT (READABLE)
# =========================
log_format docker_pretty
'$remote_addr - [$time_local] '
'"$request" $status '
'route=$route '
'upstream=$upstream_addr '
'time=$request_time '
'rt=$upstream_response_time '
'uri=$request_uri '
'upgrade=$http_upgrade '
'ua="$http_user_agent"';

server {
    listen 80;
    server_name _;

    # =========================
    # LOGS TO DOCKER
    # =========================
    access_log /dev/stdout docker_pretty;
    error_log /dev/stderr warn;

    # =========================
    # HEALTHCHECKS
    # =========================
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ping {
        default_type text/plain;
        return 200 "running\n";
    }

    # =========================
    # FRONTEND (/)
    # =========================
    location / {
        set $route "frontend";

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass ${NGINX_FRONTEND_URL};
    }

    # =========================
    # BACKEND (/api)
    # =========================
    location /api/ {
        set $route "backend";

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # remove /api prefix
        rewrite ^/api/?(.*)$ /$1 break;

        proxy_pass ${NGINX_BACKEND_URL};
    }

    # =========================
    # SHINY (/shiny-server/{id})
    # =========================

    location /shiny-server/ {
        set $route "shiny";

        # save clean path after /shiny-server/
        if ($request_uri ~ ^/shiny-server/?(.*)$) {
            set $shiny_path /$1;
        }

        auth_request /_validate_shiny_access;
        error_page 401 403 = @invalid_access;

        # now rewrite real request for shiny upstream
        rewrite ^/shiny-server/?(.*)$ /$1 break;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_pass ${NGINX_SHINY_URL};
    }

    location = /_validate_shiny_access {
        internal;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;

        proxy_pass ${NGINX_BACKEND_URL}/access$shiny_path;
    }

    location @invalid_access {
        default_type application/json;
        return 403 '{"Error":"El usuario no tiene acceso a esta aplicación de Shiny."}';
    }
}