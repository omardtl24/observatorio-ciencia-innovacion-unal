services:
  db:
    build: ./db
    container_name: app_db_prod
    restart: unless-stopped
    env_file:
      - ./db/.env.prod
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private_net

  backend:
    build: ./backend
    container_name: app_backend_prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    volumes:
      - ${FILE_STORAGE_ROOT_PROD}:${FILE_STORAGE_ROOT_PROD}:Z
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock
    security_opt:
      - label=disable
    working_dir: /app
    command: ["gunicorn", "-b", "0.0.0.0:5000", "--chdir", "/app", "wsgi:app"]
    networks:
      - private_net

  frontend:
    build: ./frontend
    container_name: app_frontend_prod
    restart: unless-stopped
    env_file:
      - ./frontend/.env.prod
    expose:
      - "5173"
    command: ["sh", "-c", "npm run build && npm run preview -- --host 0.0.0.0 --port 5173"]
    networks:
      - private_net

  shinyserver:
    build: ./shiny
    container_name: app_shiny_prod
    restart: unless-stopped
    env_file:
      - ./shiny/.env.prod
    expose:
      - "3838"
    volumes:
      - ${SHINY_SERVER_APP_DIR_PROD}:/srv/shiny-server
      - ${FILE_STORAGE_ROOT}:${FILE_STORAGE_ROOT}
      - renv_cache_prod:/renv/cache
      - r_libs_prod:/usr/local/lib/R/site-library
    networks:
      - private_net

  nginx_app:
    build: ./nginx
    container_name: app_nginx_app_prod
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - shinyserver
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:Z
    networks:
      - private_net
      - public_net

volumes:
  renv_cache_prod:
    driver: local
  r_libs_prod:
    driver: local
  postgres_data_prod:
    driver: local

networks:
  private_net:
    driver: bridge
  public_net:
    driver: bridge