services:
  db:
    build: ./db
    container_name: app_db_prod
    restart: unless-stopped
    env_file:
      - ./db/.env.prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: app_backend_prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    command: ["gunicorn", "-b", "0.0.0.0:5000", "wsgi:app"]

  frontend:
    build: ./frontend
    container_name: app_frontend_prod
    restart: unless-stopped
    env_file:
      - ./frontend/.env.prod
    ports:
      - "5173:5173"
    command: ["sh", "-c", "npm run build && npm run preview -- --host 0.0.0.0 --port 5173"]

volumes:
  postgres_data_prod:
    driver: local