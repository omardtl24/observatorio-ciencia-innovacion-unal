services:
  db:
    build: ./db
    container_name: app_db_prod
    restart: unless-stopped
    env_file:
      - ./db/.env.prod
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: app_backend_prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      FILE_STORAGE_ROOT: /srv/resources
    expose:
      - "5000"
    volumes:
      - ./shared_files:/srv/resources
    command: ["gunicorn", "-b", "0.0.0.0:5000", "wsgi:app"]

  frontend:
    build: ./frontend
    container_name: app_frontend_prod
    restart: unless-stopped
    env_file:
      - ./frontend/.env.prod
    expose:
      - "5173"
    command: ["sh", "-c", "npm run build && npm run preview -- --host 0.0.0.0 --port 5173"]

  shiny:
    build: ./shiny
    container_name: app_shiny_prod
    restart: unless-stopped
    env_file:
      - ./shiny/.env.prod
    environment:
      FILE_STORAGE_ROOT: /srv/resources
      SHINY_SERVER_APP_DIR: /srv/resources/shinny-apps
    expose:
      - "3838"
    volumes:
      - ./shared_files:/srv/resources
      - renv_cache_prod:/renv/cache

  nginx:
    image: nginx:1.27-alpine
    container_name: app_nginx_prod
    env_file:
      - ./nginx/.env.prod
    depends_on:
      - backend
      - frontend
      - shiny
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  postgres_data_prod:
    driver: local
  renv_cache_prod:
    driver: local